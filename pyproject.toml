[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imview"
version = "0.4.0"
description = "Image viewers for geospatial data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "David Shean", email = "dshean@gmail.com"}
]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "gdal",
    "matplotlib",
    "pygeotools",
    "matplotlib-scalebar",
    "matplotlib-colorbar",
]

[project.urls]
Homepage = "https://github.com/dshean/imview"

[project.scripts]
imviewer.py = "imview.imviewer:main"
stack_view.py = "imview.stack_view:main"
review_img.py = "imview.review_img:main"
color_hs.py = "imview.color_hs:main"

[tool.setuptools]
packages = ["imview", "imview.lib"]

[tool.setuptools.package-data]
"imview.lib" = ["*.cpt"]
